<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>공동 방문관리 지도 - 인증 테스트</title>
<style>
body{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;background:#f4f6f9;color:#17212f;margin:0;padding:24px}main{max-width:440px;margin:50px auto;background:#fff;border:1px solid #e2e7ee;border-radius:16px;padding:26px;box-shadow:0 8px 28px #182b4210}h1{font-size:22px}p{line-height:1.6;color:#526173}label{display:block;margin:22px 0 8px;font-weight:600}input{width:100%;box-sizing:border-box;font-size:17px;padding:13px;border:1px solid #b9c5d3;border-radius:8px}button{width:100%;padding:13px;border:0;border-radius:8px;background:#195fc4;color:#fff;font-size:16px;font-weight:700;margin-top:15px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}#status{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f6f9;border-radius:8px;padding:14px;margin-top:20px;min-height:48px}small{color:#657487}#logout{background:#475569;display:none}
</style>
</head>
<body><main><h1>공통 비밀번호 인증 테스트</h1><p>가상 테스트 전용입니다. 주민 데이터는 사용하지 않습니다.</p><form id="loginForm"><label for="password">공통 비밀번호</label><input id="password" type="password" autocomplete="off" required><button id="login" type="submit">Firebase 로그인 테스트</button></form><button id="logout" type="button">로그아웃</button><div id="status" role="status" aria-live="polite">준비 중...</div><p><small>인증 토큰과 비밀번호는 화면에 출력하지 않습니다. 로그인 시도는 60초당 5회로 제한됩니다.</small></p></main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, signInWithCustomToken, signOut, setPersistence, inMemoryPersistence } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
const config = {
  apiKey: 'AIzaSyB-wFAXdGQZ1Dhb1mX1KgUnKaD2hKY2wkg',
  authDomain: 'muju-visit-map.firebaseapp.com',
  databaseURL: 'https://muju-visit-map-default-rtdb.firebaseio.com',
  projectId: 'muju-visit-map',
  storageBucket: 'muju-visit-map.firebasestorage.app',
  messagingSenderId: '1023575587767',
  appId: '1:1023575587767:web:793d56f584e709a74f4632'
};
const status=document.getElementById('status');
const login=document.getElementById('login');
const logout=document.getElementById('logout');
const field=document.getElementById('password');
const auth=getAuth(initializeApp(config));
try{await setPersistence(auth,inMemoryPersistence);status.textContent='준비 완료. 공통 비밀번호를 입력하세요.';}catch(e){status.textContent='Firebase 초기화 실패: '+e.code;}
document.getElementById('loginForm').addEventListener('submit',async e=>{
 e.preventDefault(); login.disabled=true; status.textContent='인증 요청 중...';
 const password=field.value; field.value='';
 try{
  const response=await fetch('https://muju-visit-auth.firstq.workers.dev/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password}),cache:'no-store'});
  const data=await response.json();
  if(!response.ok){const codes={401:'비밀번호가 일치하지 않습니다.',403:'요청 출처가 허용되지 않았습니다.',429:'요청 횟수 제한. 60초 이상 기다린 후 다시 시도하세요.',500:'서버의 토큰 서명 과정에서 오류가 발생했습니다.',503:'서버 설정을 확인해야 합니다.'};throw new Error(codes[response.status]||('서버 오류 HTTP '+response.status));}
  if(!data.token)throw new Error('서버 응답에 인증 토큰이 없습니다.');
  status.textContent='맞춤 토큰 발급 성공. Firebase 로그인 중...';
  const result=await signInWithCustomToken(auth,data.token);
  status.textContent='Firebase 로그인 성공!\n사용자 UID: '+result.user.uid+'\n테스트 완료. 데이터베이스는 접근하지 않았습니다.';
  logout.style.display='block';
 }catch(err){status.textContent='로그인 실패: '+(err.code||err.message||'알 수 없는 오류');}
 finally{login.disabled=false;}
});
logout.addEventListener('click',async()=>{await signOut(auth);logout.style.display='none';status.textContent='로그아웃 완료.';});
</script></body></html>
