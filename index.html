<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>개인용 PK 위치지도</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,-apple-system,sans-serif;color:#17243a}body{display:flex;flex-direction:column;background:#f4f7fb}header{background:#182e50;color:white;padding:12px 14px;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:center}main{flex:1;min-height:0;display:flex;flex-direction:column}.controls{padding:10px;background:#fff;display:flex;flex-wrap:wrap;gap:8px;align-items:end;border-bottom:1px solid #ddd}label{font-size:12px;display:flex;flex-direction:column;gap:4px}input,button{font:inherit;font-size:14px;padding:9px;border:1px solid #ccd4e0;border-radius:7px;max-width:100%}button{border:0;background:#1768d4;color:#fff;cursor:pointer}button:disabled{opacity:.5}#map{flex:1;min-height:240px;background:#e5e9ee}#status{font-size:12px;padding:5px 12px;background:#fff;white-space:pre-wrap}#status.error{color:#b02020}.note{font-size:11px;color:#5d6c7e;margin:0;padding:0 12px 7px;background:#fff}#count{font-size:12px;color:#e5edf9}body.open .controls label,body.open .controls #open{display:none}body.open .note{display:none}
</style></head><body><header><span>개인용 PK 위치지도</span><span id="count">데이터 미로드</span></header><main><div class="controls"><label>카카오 JavaScript 키<input id="key" autocomplete="off" placeholder="JavaScript 키"></label><label>아이폰 내부 암호화 파일<input id="file" type="file" accept=".pinmap,application/octet-stream,application/json"></label><label>파일 암호<input id="password" type="password" autocomplete="off" placeholder="암호 입력"></label><button id="open">지도 열기</button><button id="close" style="display:none">데이터 닫기</button></div><div id="status">키와 파일, 암호를 입력한 뒤 지도 열기를 누르세요.</div><p class="note">파일은 서버에 업로드하지 않습니다. 다만 카카오 SDK는 외부 코드이며, 지도 이용 시 위치 관련 요청이 발생할 수 있습니다.</p><div id="map"></div></main><script>
'use strict';
const $=id=>document.getElementById(id);let map=null,markers=[],iw=null,points=[];
function msg(t,error=false){$('status').textContent=t;$('status').className=error?'error':'';}
function unb64(str){const bin=atob(str),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return arr;}
async function decrypt(file,password){
 if(file.format!=='private-pin-map'||file.version!==1||file.kdf!=='PBKDF2-SHA256'||file.cipher!=='AES-256-GCM'||file.iterations!==310000)throw Error('지원하지 않는 파일 형식입니다.');
 const enc=new TextEncoder(),salt=unb64(file.salt),iv=unb64(file.iv),data=unb64(file.data);
 if(salt.length!==16||iv.length!==12||data.length<16||data.length>10000000)throw Error('파일 형식이 올바르지 않습니다.');
 const material=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
 const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,data);
 const parsed=JSON.parse(new TextDecoder().decode(plain));
 if(parsed.version!==1||!Array.isArray(parsed.points)||parsed.points.length>10000)throw Error('좌표 데이터 형식이 올바르지 않습니다.');
 return parsed.points.filter(p=>typeof p.pk==='string'&&Number.isFinite(p.lat)&&Number.isFinite(p.lng)&&Math.abs(p.lat)<=90&&Math.abs(p.lng)<=180);
}
function sdk(key){return new Promise((resolve,reject)=>{
 if(window.kakao?.maps){kakao.maps.load(resolve);return;}
 const s=document.createElement('script');s.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+encodeURIComponent(key)+'&autoload=false';s.onload=()=>window.kakao?.maps?kakao.maps.load(resolve):reject(Error('카카오 SDK 초기화 실패'));s.onerror=()=>reject(Error('카카오 SDK 연결 실패: 키와 등록 도메인을 확인하세요.'));document.head.appendChild(s);
});}
function clear(){markers.forEach(m=>m.setMap(null));markers=[];if(iw)iw.close();points=[];$('count').textContent='데이터 미로드';}
function draw(items){clear();points=items;map=map||new kakao.maps.Map($('map'),{center:new kakao.maps.LatLng(36,127.66),level:10});iw=iw||new kakao.maps.InfoWindow({removable:true});const groups=new Map(),bounds=new kakao.maps.LatLngBounds();for(const p of points){const k=p.lat.toFixed(7)+','+p.lng.toFixed(7);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(p.pk);}for(const [coord,pks] of groups){const [lat,lng]=coord.split(',').map(Number),position=new kakao.maps.LatLng(lat,lng);const marker=new kakao.maps.Marker({map,position,title:pks.join(', ')});markers.push(marker);bounds.extend(position);kakao.maps.event.addListener(marker,'click',()=>{const box=document.createElement('div');box.style.cssText='padding:10px;max-width:240px;max-height:180px;overflow:auto;font-size:14px';box.textContent='PK: '+pks.join(', ');iw.setContent(box);iw.open(map,marker);});}if(markers.length===1){map.setCenter(markers[0].getPosition());map.setLevel(4);}else if(markers.length>1)map.setBounds(bounds);$('count').textContent=points.length+'건 / '+markers.length+'개 핀';setTimeout(()=>map.relayout(),150);}
$('open').onclick=async()=>{const key=$('key').value.trim(),pass=$('password').value,upload=$('file').files?.[0];if(!key||!pass||!upload){msg('키, 암호화 파일, 암호를 모두 입력하세요.',true);return;}$('open').disabled=true;try{msg('파일 복호화 중...');const file=JSON.parse(await upload.text());const items=await decrypt(file,pass);if(!items.length)throw Error('표시할 위치가 없습니다.');$('password').value='';msg('카카오맵 연결 중...');await sdk(key);draw(items);msg('지도 표시 완료. 핀을 누르면 PK를 볼 수 있습니다.');$('close').style.display='inline-block';document.body.classList.add('open');}catch(e){msg('열기 실패: '+(e.name==='OperationError'?'암호가 틀렸거나 파일이 손상되었습니다.':e.message),true);}finally{$('password').value='';$('open').disabled=false;}};
$('close').onclick=()=>{clear();document.body.classList.remove('open');$('close').style.display='none';msg('데이터를 닫았습니다. 새로고침하면 메모리의 데이터가 초기화됩니다.');};
window.addEventListener('resize',()=>map&&setTimeout(()=>map.relayout(),100));
</script></body></html>
